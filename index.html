<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore and manage your sneaker collection" />
    <title>SneakerHub - Your Sneaker Collection</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-900">
    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-white shadow-md border-b border-slate-200">
      <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-cyan-600 bg-clip-text text-transparent">
              SneakerHub
            </span>
          </div>
          <ul class="hidden sm:flex items-center space-x-8">
            <li>
              <button
                class="nav-btn active px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-100 font-medium"
                data-section="home"
              >
                Home
              </button>
            </li>
            <li>
              <button
                class="nav-btn relative px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-100 font-medium"
                data-section="wishlist"
              >
                Wishlist
                <span id="wishlist-badge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
                  0
                </span>
              </button>
            </li>
          </ul>
          <!-- Mobile menu button -->
          <button id="mobile-menu-btn" class="sm:hidden p-2 rounded-lg hover:bg-slate-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden sm:hidden pb-4">
          <button class="nav-btn active block w-full text-left px-4 py-2 rounded-lg hover:bg-slate-100" data-section="home">Home</button>
          <button class="nav-btn block w-full text-left px-4 py-2 rounded-lg hover:bg-slate-100" data-section="wishlist">Wishlist</button>
        </div>
      </nav>
    </header>

    <!-- Home Section -->
    <main>
      <section id="home-section" class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold mb-2">Discover Sneakers</h1>
            <p class="text-slate-600 text-lg">Browse and collect your favorite footwear</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Filters Sidebar -->
            <aside class="lg:col-span-1">
              <div class="bg-white rounded-xl shadow-sm p-6 sticky top-24">
                <h2 class="text-xl font-bold mb-6">Filters</h2>

                <!-- Price Range Filter -->
                <div class="mb-8">
                  <label class="block text-sm font-semibold mb-3">Price Range</label>
                  <div class="space-y-4">
                    <div>
                      <label for="price-min" class="text-xs text-slate-600 block mb-1">Min Price</label>
                      <input
                        type="number"
                        id="price-min"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                        value="0"
                        min="0"
                      />
                    </div>
                    <div>
                      <label for="price-max" class="text-xs text-slate-600 block mb-1">Max Price</label>
                      <input
                        type="number"
                        id="price-max"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                        value="999"
                        min="0"
                      />
                    </div>
                  </div>
                </div>

                <!-- Brand Filter -->
                <div class="mb-6">
                  <label for="brand-select" class="block text-sm font-semibold mb-3">Brand</label>
                  <select
                    id="brand-select"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer bg-white"
                  >
                    <option value="All">All Brands</option>
                    <option value="Nike">Nike</option>
                    <option value="Puma">Puma</option>
                    <option value="Adidas">Adidas</option>
                  </select>
                </div>

                <!-- Clear Filters -->
                <button
                  id="clear-filters-btn"
                  class="w-full px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-900 rounded-lg font-medium transition-colors duration-200"
                >
                  Clear Filters
                </button>
              </div>
            </aside>

            <!-- Sneakers Grid -->
            <div class="lg:col-span-3">
              <div id="sneaker-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Loading skeleton -->
                <div class="col-span-full flex items-center justify-center py-12">
                  <div class="animate-pulse text-slate-400">Loading sneakers...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Wishlist Section -->
      <section id="wishlist-section" class="hidden py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <h1 class="text-4xl sm:text-5xl font-bold mb-8">My Wishlist</h1>
          <div id="wishlist-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">
              Your wishlist is empty. Add some sneakers!
            </div>
          </div>
        </div>
      </section>

      <!-- Sneaker Details Modal -->
      <div id="details-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
          <!-- Backdrop -->
          <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"></div>

          <!-- Modal Content -->
          <div class="relative bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-auto">
            <button
              id="close-modal-btn"
              class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100"
              aria-label="Close"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>

            <div class="p-8">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Image -->
                <div class="flex items-center justify-center">
                  <img
                    id="modal-image"
                    src=""
                    alt="Sneaker"
                    class="w-full h-auto max-w-sm rounded-lg object-cover"
                  />
                </div>

                <!-- Details -->
                <div class="flex flex-col justify-between">
                  <div>
                    <h3 id="modal-brand" class="text-3xl font-bold mb-2"></h3>
                    <p id="modal-model" class="text-slate-600 text-lg mb-4"></p>

                    <div class="space-y-3 py-4 border-y border-slate-200">
                      <div class="flex justify-between">
                        <span class="text-slate-600">Color:</span>
                        <span id="modal-color" class="font-semibold"></span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-600">Size:</span>
                        <span id="modal-size" class="font-semibold"></span>
                      </div>
                    </div>

                    <p id="modal-comments" class="text-slate-700 py-4 text-sm leading-relaxed"></p>
                  </div>

                  <div>
                    <div class="mb-4">
                      <span class="text-slate-600">Price:</span>
                      <p id="modal-price" class="text-4xl font-bold text-blue-600"></p>
                    </div>
                    <button
                      id="modal-wishlist-btn"
                      class="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-semibold rounded-lg hover:shadow-lg transition-all duration-200 transform hover:scale-105"
                    >
                      Add to Wishlist
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
